name: Build Android APK (Kotlin)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore google-services.json from secret
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set — build will fail at the google-services plugin step. Add it as a base64-encoded secret."
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Kotlin-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Post build summary
        if: always()
        run: |
          echo "## Pulse Kotlin build" >> $GITHUB_STEP_SUMMARY
          echo "Artifact: Pulse-Kotlin-Debug (app-debug.apk)" >> $GITHUB_STEP_SUMMARY
          echo "Secrets required: SUPABASE_URL, SUPABASE_ANON_KEY, GOOGLE_SERVICES_JSON (base64)" >> $GITHUB_STEP_SUMMARY
